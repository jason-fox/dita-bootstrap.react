openapi: 3.0.3
info:
  title: Data Store API
  description: |
    Static file server and document set manager for AST-rendered DITA content.
    Serves both topic data (JSON) and manages document collections via zip uploads.

    **Authentication**: Optional bearer token (set `AUTH_TOKEN` env var).
    Write operations (`POST`, `PUT`, `DELETE` on `/api/docs/*`) require auth when enabled.

    **Search Index**: Built automatically on startup and after each doc set upload.
  version: 1.0.0
servers:
  - url: "{scheme}://{host}:{port}"
    description: Your deployment; the service speaks plain HTTP, so use https only behind a TLS-terminating proxy
    variables:
      scheme:
        default: http
        enum:
          - http
          - https
      host:
        default: your-host.example.com
        description: Hostname or IP of the machine or proxy running the service
      port:
        default: "4000"
        description: Port set by the PORT env var

paths:
  /health:
    get:
      summary: Health check
      tags:
        - Data Store - System
      operationId: getHealth
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  dataDir:
                    type: string
                    description: Absolute path to data directory
                    example: /var/data
                  pid:
                    type: integer
                    description: Worker process ID
                    example: 12345
                  isWorker:
                    type: boolean
                    description: Whether running as cluster worker
                    example: true

  /api/docs:
    get:
      summary: List all document sets
      tags:
        - Data Store - Document Sets
      operationId: listDocSets
      description: |
        Returns all discovered document sets (directories with `toc.json`).
        Ordered by featured/priority/title.
      responses:
        "200":
          description: List of document sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocSetInfo"

  /api/docs/{docSetId}:
    parameters:
      - name: docSetId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[^\.\/][^/]*(/[^\.\/][^/]*)*$
        description: |
          Document set identifier (forward-slash separated path).
          Root set is "default", nested sets use "parent/child" format.
          Cannot contain ".." or start with "/" (path traversal blocked).
        example: my-docs
    head:
      summary: Check if document set exists
      tags:
        - Data Store - Document Sets
      operationId: checkDocSetExists
      responses:
        "200":
          description: Document set exists
        "404":
          description: Document set not found

    get:
      summary: Get document set metadata
      tags:
        - Data Store - Document Sets
      operationId: getDocSet
      responses:
        "200":
          description: Document set info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocSetInfo"
        "404":
          description: Document set not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/doc-set-not-found
                title: Not Found
                status: 404
                detail: "Doc set 'missing' not found"

    post:
      summary: Create a new document set
      tags:
        - Data Store - Document Sets
      operationId: createDocSet
      description: |
        Uploads a zip archive containing AST-rendered DITA content.
        Fails with 409 if the doc set already exists.
        Automatically builds search index after extraction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
              description: Zip archive of AST-rendered content with `toc.json` at root
      responses:
        "201":
          description: Document set created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of newly created document set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocSetInfo"
        "400":
          description: Invalid ID or malformed zip
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/invalid-doc-set-id
                title: Bad Request
                status: 400
                detail: "Invalid doc set id '../escape'"
        "401":
          description: Missing or invalid Authorization header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unauthorized
                title: Unauthorized
                status: 401
                detail: "Missing or invalid Authorization: Bearer <token> header"
        "409":
          description: Document set already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/doc-set-exists
                title: Conflict
                status: 409
                detail: "Doc set 'my-docs' already exists"
        "413":
          description: Upload exceeds MAX_UPLOAD_SIZE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/payload-too-large
                title: Payload Too Large
                status: 413
                detail: "Request body exceeds the 100mb limit"
        "415":
          description: Missing or invalid Content-Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unsupported-media-type
                title: Unsupported Media Type
                status: 415
                detail: "Content-Type must be application/zip"

    put:
      summary: Update an existing document set
      tags:
        - Data Store - Document Sets
      operationId: updateDocSet
      description: |
        Replaces all content in an existing document set with a new zip archive.
        Fails with 404 if the doc set doesn't exist.
        Automatically rebuilds search index after extraction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
              description: Zip archive of AST-rendered content with `toc.json` at root
      responses:
        "200":
          description: Document set updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocSetInfo"
        "400":
          description: Invalid ID or malformed zip
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/invalid-doc-set-id
                title: Bad Request
                status: 400
                detail: "Invalid doc set id '../escape'"
        "401":
          description: Missing or invalid Authorization header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unauthorized
                title: Unauthorized
                status: 401
                detail: "Missing or invalid Authorization: Bearer <token> header"
        "404":
          description: Document set not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/doc-set-not-found
                title: Not Found
                status: 404
                detail: "Doc set 'missing' not found"
        "413":
          description: Upload exceeds MAX_UPLOAD_SIZE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/payload-too-large
                title: Payload Too Large
                status: 413
                detail: "Request body exceeds the 100mb limit"
        "415":
          description: Missing or invalid Content-Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unsupported-media-type
                title: Unsupported Media Type
                status: 415
                detail: "Content-Type must be application/zip"

    delete:
      summary: Delete a document set
      tags:
        - Data Store - Document Sets
      operationId: deleteDocSet
      description: Removes the entire document set directory and all its contents.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Document set deleted successfully
        "401":
          description: Missing or invalid Authorization header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unauthorized
                title: Unauthorized
                status: 401
                detail: "Missing or invalid Authorization: Bearer <token> header"
        "404":
          description: Document set not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/doc-set-not-found
                title: Not Found
                status: 404
                detail: "Doc set 'missing' not found"

  /api/chrome:
    get:
      summary: Get chrome (UI chrome) configuration
      tags:
        - Data Store - Configuration
      operationId: getChrome
      description: |
        Retrieves the shared UI chrome configuration from `chrome.json`.
        Contains strings and state used across all document sets (headers, footers, etc).
      responses:
        "200":
          description: Chrome configuration
          content:
            application/json:
              schema:
                type: object
                description: Arbitrary chrome configuration object
                example:
                  texts:
                    navTitle: My Documentation

    post:
      summary: Update chrome configuration (POST)
      tags:
        - Data Store - Configuration
      operationId: updateChromePost
      description: Replaces the entire `chrome.json` configuration. (Alias for PUT)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: New chrome configuration
      responses:
        "202":
          description: Chrome configuration updated
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Failed to write chrome.json
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/chrome-write-failed
                title: Bad Request
                status: 400
                detail: "Failed to write chrome.json: Unexpected end of JSON input"
        "401":
          description: Missing or invalid Authorization header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unauthorized
                title: Unauthorized
                status: 401
                detail: "Missing or invalid Authorization: Bearer <token> header"
        "415":
          description: Content-Type must be application/json
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unsupported-media-type
                title: Unsupported Media Type
                status: 415
                detail: "Content-Type must be application/json"

    put:
      summary: Update chrome configuration (PUT)
      tags:
        - Data Store - Configuration
      operationId: updateChromePut
      description: Replaces the entire `chrome.json` configuration.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: New chrome configuration
      responses:
        "202":
          description: Chrome configuration updated
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Failed to write chrome.json
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/chrome-write-failed
                title: Bad Request
                status: 400
                detail: "Failed to write chrome.json: Unexpected end of JSON input"
        "401":
          description: Missing or invalid Authorization header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unauthorized
                title: Unauthorized
                status: 401
                detail: "Missing or invalid Authorization: Bearer <token> header"
        "415":
          description: Content-Type must be application/json
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://dita-bootstrap.org/errors/unsupported-media-type
                title: Unsupported Media Type
                status: 415
                detail: "Content-Type must be application/json"

  /data/{topicPath}:
    get:
      summary: Serve topic JSON or static files
      tags:
        - Data Store - Content
      operationId: getTopicContent
      description: |
        Serves AST-rendered topic JSON files and static assets from the data directory.
        File extensions are resolved automatically (`.json` added if not present).
        Cache-Control header set to "no-cache" to reflect updates.
      parameters:
        - name: topicPath
          in: path
          required: true
          schema:
            type: string
          description: Path to topic file (relative to data dir)
          example: index.json
        - name: topicPath
          in: path
          required: true
          schema:
            type: string
          description: Path to toc.json
          example: toc.json
      responses:
        "200":
          description: File contents
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Topic"
                  - $ref: "#/components/schemas/TOC"
        "404":
          description: File not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional RFC 6750 bearer token (only required if AUTH_TOKEN env var is set).
        Header format: `Authorization: Bearer <token>`

  schemas:
    DocSetInfo:
      type: object
      description: Metadata about a document set
      required:
        - id
        - title
        - topicCount
      properties:
        id:
          type: string
          description: Unique identifier (path relative to data dir, "default" for root)
          example: my-docs
        title:
          type: string
          description: Display name (from toc.json or defaults to id)
          example: My Documentation
        description:
          type: string
          description: Long-form description (optional, from toc.json or index.json)
          example: Complete guide to the system
        group:
          type: string
          description: Parent path for nested doc sets (e.g. "parent" if id="parent/child")
          example: api-docs
        navToc:
          type: string
          description: Stringified TOC structure for navigation sidebar (optional)
        scrollspyToc:
          type: string
          description: Stringified TOC for scrollspy highlights (optional)
        menubar:
          type: boolean
          description: Whether to show a menubar (optional)
        topicCount:
          type: integer
          description: Number of JSON topic files in this doc set
          example: 42
        featured:
          type: boolean
          description: Whether this doc set is featured (appears first in listings)
        priority:
          type: integer
          description: Sort priority (higher = earlier, default 100 if featured, else 0)
          example: 50

    Topic:
      type: object
      description: A single AST-rendered DITA topic
      properties:
        meta:
          type: object
          description: Topic metadata
          properties:
            title:
              type: string
            shortdesc:
              type: string
            keywords:
              type: array
              items:
                type: string
            lang:
              type: string
              example: en
        content:
          type: array
          description: AST tree - see AstNode
          items:
            $ref: "#/components/schemas/AstNode"

    TOC:
      type: object
      description: Merged table of contents for all topics in a doc set
      properties:
        title:
          type: string
          description: Doc set title
        description:
          type: string
          description: Doc set description
        shortdesc:
          type: string
        featured:
          type: boolean
        priority:
          type: integer
        lang:
          type: string
        toc:
          type: array
          description: TOC entries (each is an AstNode with href pointing to topic .json)
          items:
            $ref: "#/components/schemas/AstNode"

    AstNode:
      oneOf:
        - type: string
          description: Text node
        - type: array
          description: |
            Element node tuple: `[type, props?, ...children]`
            - type (string): lowercase HTML tag or react-bootstrap component name
            - props (object, optional): element attributes/props
            - children: remaining array elements
          minItems: 1
          maxItems: 999
          items: {}

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details response
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
          enum:
            - https://dita-bootstrap.org/errors/unauthorized
            - https://dita-bootstrap.org/errors/chrome-read-failed
            - https://dita-bootstrap.org/errors/chrome-write-failed
            - https://dita-bootstrap.org/errors/unsupported-media-type
            - https://dita-bootstrap.org/errors/doc-set-not-found
            - https://dita-bootstrap.org/errors/doc-set-exists
            - https://dita-bootstrap.org/errors/invalid-doc-set-id
            - https://dita-bootstrap.org/errors/empty-payload
            - https://dita-bootstrap.org/errors/invalid-zip
            - https://dita-bootstrap.org/errors/extract-failed
            - https://dita-bootstrap.org/errors/payload-too-large
            - https://dita-bootstrap.org/errors/invalid-json
          example: https://dita-bootstrap.org/errors/doc-set-not-found
        title:
          type: string
          description: Short human-readable error title
          example: Not Found
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Detailed explanation
          example: "Doc set 'missing' not found"

tags:
  - name: Data Store - System
    description: Server health and diagnostics
  - name: Data Store - Document Sets
    description: Manage collections of AST-rendered DITA topics
  - name: Data Store - Configuration
    description: Shared UI chrome configuration
  - name: Data Store - Content
    description: Serve topic JSON and static files
