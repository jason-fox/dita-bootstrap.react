<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1000" height="640" fill="#f8f9fa" rx="8"/>

  <!-- Topbar Header -->
  <rect width="1000" height="56" fill="#0d6efd" rx="8"/>
  <rect y="48" width="1000" height="8" fill="#0d6efd"/>
  
  <!-- Navbar Content -->
  <text x="24" y="34" font-size="18" font-weight="700" fill="#ffffff">Documentation Store</text>
  <text x="220" y="34" font-size="14" fill="#e0e0e0">Portal</text>
  
  <!-- Search Input in Header -->
  <rect x="620" y="12" width="220" height="32" fill="#ffffff" fill-opacity="0.2" rx="4"/>
  <text x="635" y="33" font-size="13" fill="#ffffff">🔍 Search docs store...</text>
  
  <!-- Theme Switcher -->
  <rect x="855" y="12" width="120" height="32" fill="#ffffff" fill-opacity="0.2" rx="4"/>
