<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1000" height="680" fill="#f8f9fa" rx="8"/>

  <!-- Chat Topbar Header -->
  <rect width="1000" height="56" fill="#212529" rx="8"/>
  <rect y="48" width="1000" height="8" fill="#212529"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#ffffff">🤖 AI Assistant</text>
  <rect x="150" y="16" width="140" height="24" fill="#0d6efd" rx="12"/>
  <text x="162" y="32" font-size="11" font-weight="600" fill="#ffffff">gemini-3.6-flash</text>

  <!-- Clear Chat & Theme Buttons -->
  <rect x="740" y="12" width="110" height="32" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" rx="4"/>
  <text x="755" y="33" font-size="12" fill="#ffffff">🗑️ Clear Chat</text>
  <rect x="860" y="12" width="115" height="32" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" rx="4"/>
  <text x="875" y="33" font-size="12" fill="#ffffff">🌓 Theme</text>

  <!-- User Query Bubble (Right-aligned) -->
  <g transform="translate(420, 85)">
    <rect width="556" height="52" fill="#0d6efd" rx="12"/>
    <text x="20" y="32" font-size="15" font-weight="500" fill="#ffffff">Is holly a good summer flower?</text>
  </g>

  <!-- Assistant Response Card (Left-aligned) -->
  <g transform="translate(24, 155)">
    <rect width="952" height="420" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="8"/>
    
    <!-- Tool Invocations Accordion -->
    <rect x="20" y="20" width="912" height="44" fill="#f1f3f5" stroke="#ced4da" stroke-width="1" rx="6"/>
    <text x="40" y="47" font-size="13" font-weight="600" fill="#495057">🛠️ Tool Invocations (2 executed)</text>
    <text x="880" y="47" font-size="12" fill="#6c757d">▼ Expand</text>
    
    <text x="40" y="85" font-size="12" font-family="monospace" fill="#0d6efd">1. search_documentation({ query: "holly summer flower" }) ➔ 2 results</text>
    <text x="40" y="105" font-size="12" font-family="monospace" fill="#0d6efd">2. get_topic_content({ docId: "flowers", topicId: "concepts/winterFlowers.json" })</text>

    <line x1="20" y1="125" x2="932" y2="125" stroke="#e9ecef" stroke-width="1"/>

    <!-- Answer Title -->
    <text x="40" y="160" font-size="17" font-weight="700" fill="#dc3545">No, Holly (Holly berry) is a winter flower, not a summer flower.</text>
    
    <!-- Answer Body Paragraphs -->
    <text x="40" y="195" font-size="14" fill="#212529">According to the <tspan font-weight="600" fill="#0d6efd">Winter Flowers</tspan> documentation topic (<tspan font-family="monospace" font-size="13">flowers/concepts/winterFlowers.json</tspan>):</text>
    
    <!-- Bullet points -->
    <text x="60" y="230" font-size="14" fill="#212529">• <tspan font-weight="600">Blooming Season:</tspan> Winter (December through February in the Northern hemisphere).</text>
    <text x="60" y="260" font-size="14" fill="#212529">• <tspan font-weight="600">Associated Winter Flora:</tspan> Holly berry, Helleborus, Amaryllis, Chrysanthemums, and Evergreens.</text>
    
    <!-- Callout Box: Summer Alternatives -->
    <rect x="40" y="290" width="872" height="110" fill="#e8f4f8" stroke="#b6d4fe" stroke-width="1" rx="6"/>
    <text x="60" y="320" font-size="14" font-weight="700" fill="#0c5460">💡 Recommended Summer Blooming Alternatives:</text>
    <text x="60" y="350" font-size="13" fill="#0c5460">If you are selecting flowers for a summer garden, the documentation recommends:</text>
    <text x="60" y="378" font-size="13" font-weight="600" fill="#0d6efd">Gardenia, Gerbera Daisy, Iris, Lilac, Rose, and Salvia.</text>
  </g>

  <!-- Prompt Input Bar at Bottom -->
  <rect x="24" y="595" width="952" height="60" fill="#ffffff" stroke="#ced4da" stroke-width="1" rx="8"/>
  <text x="44" y="631" font-size="14" fill="#6c757d">Ask a technical question or request a component preview...</text>
  <rect x="860" y="609" width="100" height="32" fill="#0d6efd" rx="4"/>
  <text x="890" y="630" font-size="13" font-weight="600" fill="#ffffff">Send ↗</text>
</svg>
