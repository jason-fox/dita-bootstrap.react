<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Bootstrap 5 & Icons matching DITA-Bootstrap Docs Portal -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
  <script>
    (function() {
      const MODES = ["light", "dark", "auto"];
      const stored = localStorage.getItem("theme");
      const mode = stored && MODES.includes(stored) ? stored : "auto";
      const resolved = mode === "auto"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : mode;
      document.documentElement.setAttribute("data-bs-theme", resolved);
    })();
  </script>
  <style>
    /* --- bootswatch-colors.css --- */
    :root {
      --dita-prussian-blue: var(--bs-primary-text-emphasis);
      --dita-maroon: var(--bs-danger-text-emphasis);
      --dita-violet: var(--bs-purple);
      --bs-code-color: rgb(from var(--bs-danger) r g calc(b + 63));
    }

    /* --- bootswatch-static.css (dark-mode-only override) --- */
    [data-bs-theme="dark"] {
      --dita-prussian-blue: #6a91cf;
      --dita-violet: #cc99cd;
      --dita-maroon: #ff7676;
    }

    .chat-bubble-user {
      max-width: 80%;
      border-radius: 1.25rem 1.25rem 0.25rem 1.25rem;
      background-color: var(--bs-primary);
      color: #fff;
    }
    .chat-bubble-assistant {
      max-width: 85%;
      border-radius: 1.25rem 1.25rem 1.25rem 0.25rem;
      background-color: var(--bs-body-bg);
      border: 1px solid var(--bs-border-color);
      color: var(--bs-body-color);
    }

    /* Paragraph & Code block formatting for Markdown rendered inside chat bubbles */
    .chat-bubble-assistant p:last-child { 
      margin-bottom: 0; 
    }
    .chat-bubble-assistant pre { 
      background: var(--bs-tertiary-bg); 
      border: 1px solid var(--bs-border-color); 
      border-radius: var(--bs-border-radius); 
      padding: 0.75rem; 
      overflow-x: auto; 
    }
    .chat-bubble-assistant code { 
      font-size: 0.875em; 
    }
    
    /* Code block syntax highlighting rules matching dita-styles.ts */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #808080; font-style: italic; }
    .token.punctuation { color: #a6adc8; }
    .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #f38ba8; }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #a6e3a1; }
    .token.operator, .token.entity, .token.url, .language-css .token.string, .style .token.string { color: #89dceb; }
    .token.atrule, .token.attr-value, .token.keyword { color: #cba6f7; font-weight: 600; }
    .token.function, .token.class-name { color: #89b4fa; }
    .token.regex, .token.important, .token.variable { color: #fab387; }

    .iframe-header-clickable {
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }
    .iframe-header-clickable:hover {
      background-color: var(--bs-border-color-translucent) !important;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
  <!-- Navbar matching frontend/ DITA Docs Portal -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom shadow-sm py-2 sticky-top flex-shrink-0" data-bs-theme="dark">
    <div class="container-xxl px-4">
      <a class="navbar-brand d-flex align-items-center fw-semibold text-white me-3" href="#">
        <img src="/favicon.svg" alt="DITA Finch Logo" style="width: 1.75rem; height: 1.75rem;" class="me-2">
        <span id="nav-brand-title">AI Assistant</span>
      </a>

      <button class="navbar-toggler p-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="navbar-nav me-auto" id="nav-links-container">
          <!-- Injectable nav links from nav-links.html will be placed here -->
        </div>

        <div class="navbar-nav align-items-lg-center gap-3 ms-auto mt-2 mt-lg-0">
          <button onclick="clearChat()" class="btn btn-outline-light btn-sm d-flex align-items-center" title="Clear conversation to reset context & save tokens">
            <i class="bi bi-trash3 pe-2"></i>
            <span>Clear Chat</span>
          </button>
          <button
            type="button"
            id="theme-toggle-btn"
            class="nav-link px-2 d-flex align-items-center"
            aria-label="Toggle theme"
            onclick="cycleTheme()"
          >
            <i id="theme-toggle-icon" class="bi bi-circle-half fs-5"></i>
          </button>
          <div class="d-none align-items-center gap-3" id="debug-badges">
            <span class="badge bg-body-secondary text-body border font-monospace" id="provider-badge">
              Provider: Checking...
            </span>
            <span class="badge text-bg-success border" id="mcp-status-badge">
              <i class="bi bi-circle-fill pe-3 fs-6"></i> MCP Connected
            </span>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Chat Container -->
  <main class="flex-grow-1 container-fluid py-4 d-flex flex-column overflow-hidden">
    <div class="row justify-content-center flex-grow-1 overflow-hidden">
      <div class="col-12 col-xl-10 d-flex flex-column h-100 overflow-hidden">
        <!-- Messages Scroll Region -->
        <div id="messages-container" class="flex-grow-1 overflow-auto pe-2 mb-3 d-flex flex-column gap-3">
          <!-- Welcome Card -->
          <div class="card shadow-sm mb-3" id="welcome-card">
            <div class="card-body">
              <h5 class="card-title text-body mb-2" id="welcome-title">
                Welcome to AI Assistant
              </h5>
              <p class="card-text text-secondary small" id="welcome-desc">
                Ask technical questions or request interactive previews for loaded documentation sets.
              </p>
              <div class="d-flex flex-wrap gap-2 pt-1" id="quick-prompts-container">
                <button onclick="sendQuickPrompt('What documentation sets are available?')" class="btn btn-outline-secondary btn-sm">
                  <span class="pe-3">📚</span>List Doc Sets
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Input Box -->
        <div class="card shadow-sm flex-shrink-0">
          <div class="card-body p-2">
            <form id="chat-form" onsubmit="handleFormSubmit(event)" class="d-flex gap-2">
              <input 
                type="text" 
                id="user-input" 
                placeholder="Ask a question or request a component preview..." 
                class="form-control border-0 shadow-none" 
                autocomplete="off"
              />
              <button 
                type="submit" 
                id="send-btn"
                class="btn btn-primary d-flex align-items-center flex-shrink-0 px-4"
              >
                <span>Send</span>
                <i class="bi bi-send-fill ps-3"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Full Topic Viewer Modal -->
  <div class="modal fade" id="topicModal" tabindex="-1" aria-labelledby="topicModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered" style="max-width: 96vw;">
      <div class="modal-content card" style="height: 92vh;">
        <div class="modal-header card-header">
          <span class="h5 mb-0 text-body-secondary d-flex align-items-center gap-2" id="topicModalTitle">
            Topic Viewer
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body card-body p-0">
          <iframe id="modal-iframe" class="w-100 h-100 border-0 d-block"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    const history = [];
    const messagesContainer = document.getElementById('messages-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    let showToolInvocations = false;

    // --- DARK MODE TOGGLE (matching frontend/components/DarkModeToggle.tsx) ---
    const MODES = ["light", "dark", "auto"];
    const ICONS = {
      light: "bi-brightness-high-fill",
      dark: "bi-moon-stars-fill",
      auto: "bi-circle-half",
    };
    const STORAGE_KEY = "theme";

    let currentMode = "auto";

    function resolveTheme(mode) {
      if (mode === "auto") {
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      return mode;
    }

    function applyTheme(mode) {
      currentMode = mode;
      const resolved = resolveTheme(mode);
      document.documentElement.setAttribute("data-bs-theme", resolved);

      const iconEl = document.getElementById("theme-toggle-icon");
      const btnEl = document.getElementById("theme-toggle-btn");
      if (iconEl) {
        iconEl.className = `bi ${ICONS[mode]} fs-5`;
      }
      if (btnEl) {
        const nextMode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
        btnEl.setAttribute("aria-label", `Switch to ${nextMode} mode (currently ${mode})`);
        btnEl.setAttribute("title", `Theme: ${mode} (click for ${nextMode})`);
      }

      // Propagate active theme to any loaded topic viewer iframes
      document.querySelectorAll('iframe').forEach(iframe => {
        if (iframe._lastPayload) {
          iframe._lastPayload.theme = resolved;
          iframe.contentWindow?.postMessage({ type: 'SET_PAYLOAD', payload: iframe._lastPayload }, '*');
        }
      });
    }

    function cycleTheme() {
      const next = MODES[(MODES.indexOf(currentMode) + 1) % MODES.length];
      localStorage.setItem(STORAGE_KEY, next);
      applyTheme(next);
    }

    function initTheme() {
      const stored = localStorage.getItem(STORAGE_KEY);
      const initial = stored && MODES.includes(stored) ? stored : "auto";
      applyTheme(initial);

      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (currentMode === "auto") {
          applyTheme("auto");
        }
      });
    }

    initTheme();

    function openTopicModal(titleText, payload) {
      const modalTitle = document.getElementById('topicModalTitle');
      const modalIframe = document.getElementById('modal-iframe');
      
      if (modalTitle) {
        modalTitle.innerHTML = titleText;
      }

      if (modalIframe) {
        const viewerUrl = `${window.location.protocol}//${window.location.hostname}:4001/viewer`;
        modalIframe.src = viewerUrl;

        const clonedPayload = JSON.parse(JSON.stringify(payload));
        clonedPayload.previewMode = false; // Allow desktop sidebar in wide modal view
        clonedPayload.theme = resolveTheme(currentMode);
        modalIframe._lastPayload = clonedPayload;

        modalIframe.onload = () => {
          const sendPayload = () => modalIframe.contentWindow?.postMessage({ type: 'SET_PAYLOAD', payload: clonedPayload }, '*');
          sendPayload();
          setTimeout(sendPayload, 100);
          setTimeout(sendPayload, 300);
          setTimeout(sendPayload, 800);
        };
      }

      const modalEl = document.getElementById('topicModal');
      if (modalEl && window.bootstrap && bootstrap.Modal) {
        const bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
        bsModal.show();
      }
    }

    // Configure marked with Prism syntax highlighting
    if (window.marked && typeof marked.Renderer === 'function') {
      const renderer = new marked.Renderer();
      renderer.code = function(codeOrObj, infostring) {
        let text = "";
        let lang = "";

        if (typeof codeOrObj === "object" && codeOrObj !== null) {
          text = codeOrObj.text || "";
          lang = codeOrObj.lang || "";
        } else {
          text = String(codeOrObj || "");
          lang = String(infostring || "");
        }

        const language = (lang && window.Prism && Prism.languages[lang]) ? lang : "bash";
        const grammar = window.Prism ? (Prism.languages[language] || Prism.languages.bash || Prism.languages.markup) : null;
        let highlighted = text;
        try {
          if (grammar) {
            highlighted = Prism.highlight(text, grammar, language);
          }
        } catch (e) {
          highlighted = text;
        }

        return `<pre class="language-${language}"><code class="language-${language}">${highlighted}</code></pre>`;
      };
      marked.use({ renderer });
    }

    // Fetch Health on Load
    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (data.showToolInvocations) {
          showToolInvocations = true;
          const debugBadges = document.getElementById('debug-badges');
          if (debugBadges) {
            debugBadges.classList.remove('d-none');
            debugBadges.classList.add('d-flex');
          }
        }
        document.getElementById('provider-badge').textContent = `${data.provider} (${data.model})`;
        const badge = document.getElementById('mcp-status-badge');
        
        if (data.mcpConnected) {
          badge.className = "badge text-bg-success border";
          badge.innerHTML = `<i class="bi bi-check-circle-fill pe-3"></i> MCP Connected (${data.toolsCount} tools)`;
        } else {
          badge.className = "badge text-bg-danger border";
          badge.innerHTML = `<i class="bi bi-x-circle-fill pe-3"></i> MCP Offline`;
        }

        // Dynamically update Welcome Card text & quick prompts (capped at max 3 items)
        if (Array.isArray(data.docSets) && data.docSets.length > 0) {
          const maxShown = 3;
          const totalDocs = data.docSets.length;
          const shownDocSets = data.docSets.slice(0, maxShown);
          const titles = shownDocSets.map(ds => ds.title || ds.id).join(', ');
          
          const descEl = document.getElementById('welcome-desc');
          if (descEl) {
            if (totalDocs > maxShown) {
              const remaining = totalDocs - maxShown;
              descEl.textContent = `Ask technical questions or request interactive previews across ${totalDocs} loaded documentation sets (including ${titles}, and ${remaining} more).`;
            } else {
              descEl.textContent = `Ask technical questions or request interactive previews across loaded documentation sets: ${titles}.`;
            }
          }

          const promptsContainer = document.getElementById('quick-prompts-container');
          if (promptsContainer) {
            promptsContainer.innerHTML = `
              <button onclick="sendQuickPrompt('What documentation sets are available?')" class="btn btn-outline-secondary btn-sm">
                <span class="pe-3">📚</span>List All (${totalDocs}) Doc Sets
              </button>
            `;
            shownDocSets.forEach(ds => {
              const btn = document.createElement('button');
              btn.className = 'btn btn-outline-primary btn-sm';
              btn.onclick = () => sendQuickPrompt(`Show me overview for ${ds.title || ds.id}`);
              btn.innerHTML = `<span class="pe-3">📖</span>${ds.title || ds.id}`;
              promptsContainer.appendChild(btn);
            });
          }
        }
      } catch (e) {
        document.getElementById('provider-badge').textContent = 'Error';
      }
    }
    checkHealth();

    function sendQuickPrompt(text) {
      userInput.value = text;
      handleFormSubmit(new Event('submit'));
    }

    function clearChat() {
      history.length = 0;
      const welcomeCard = document.getElementById('welcome-card');
      messagesContainer.innerHTML = '';
      if (welcomeCard) {
        messagesContainer.appendChild(welcomeCard);
      }
    }

    function appendMessage(role, text, toolResults = []) {
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'd-flex justify-content-end mb-3' : 'd-flex justify-content-start mb-3 w-100';

      const bubble = document.createElement('div');
      const hasInteractive = toolResults && toolResults.some(tr => tr.toolName === 'render_topic_ui');
      
      bubble.className = role === 'user' 
        ? 'chat-bubble-user p-3 shadow-sm' 
        : `chat-bubble-assistant p-3 shadow-sm ${hasInteractive ? 'mw-100 w-100' : ''}`;

      if (role === 'user') {
        bubble.textContent = text;
      } else {
        try {
          if (window.marked && typeof marked.parse === 'function') {
            bubble.innerHTML = marked.parse(text || "");
          } else {
            bubble.textContent = text || "";
          }
        } catch(err) {
          console.error("Markdown parse error:", err);
          bubble.textContent = text || "";
        }

        // If render_topic_ui tool call was made, render FULL WIDTH Bootstrap iframe card
        if (toolResults && toolResults.length > 0) {
          toolResults.forEach(tr => {
            if (tr.toolName === 'render_topic_ui') {
              const card = document.createElement('div');
              card.className = 'card shadow-sm mt-3 w-100';
              
              let payload = null;
              try {
                const text = tr.result?.content?.[0]?.text;
                if (text) payload = JSON.parse(text);
              } catch(e){}

              const viewerUrl = `${window.location.protocol}//${window.location.hostname}:4001/viewer`;

              const header = document.createElement('div');
              header.className = 'card-header d-flex justify-content-between align-items-center iframe-header-clickable user-select-none';
              header.title = 'Click to view full topic in fullscreen modal';
              
              const docTitle = payload?.toc?.title || payload?.docId;
              const pageTitle = payload?.doc?.meta?.title || tr.args?.topicPath || 'Topic Viewer';
              const titleText = docTitle && docTitle !== pageTitle ? `${docTitle} | ${pageTitle}` : pageTitle;

              header.innerHTML = `
                <span class="h5 mb-0 text-body-secondary d-flex align-items-center gap-2">${titleText}</span>
                <button type="button" class="btn p-0 border-0 text-body-secondary d-flex align-items-center justify-content-center" style="width: 1.5rem; height: 1.5rem;" aria-label="Expand topic" title="Expand topic">
                  <i class="bi bi-arrows-angle-expand fs-6"></i>
                </button>
              `;

              if (payload) {
                header.onclick = () => openTopicModal(titleText, payload);
              }

              card.appendChild(header);

              const cardBody = document.createElement('div');
              cardBody.className = 'card-body p-0';

              const iframe = document.createElement('iframe');
              iframe.className = 'w-100 border-0 d-block';
              iframe.style.height = '480px';
              iframe.src = viewerUrl;
              
              iframe.onload = () => {
                if (payload) {
                  const inlinePayload = JSON.parse(JSON.stringify(payload));
                  inlinePayload.previewMode = true; // Suppress desktop sidebar in inline card preview
                  inlinePayload.theme = resolveTheme(currentMode);
                  iframe._lastPayload = inlinePayload;
                  const sendPayload = () => iframe.contentWindow?.postMessage({ type: 'SET_PAYLOAD', payload: inlinePayload }, '*');
                  sendPayload();
                  setTimeout(sendPayload, 100);
                  setTimeout(sendPayload, 300);
                  setTimeout(sendPayload, 800);
                }
              };

              cardBody.appendChild(iframe);
              card.appendChild(cardBody);
              bubble.appendChild(card);
            } else if (showToolInvocations) {
              const card = document.createElement('div');
              card.className = 'mt-2 p-2 bg-body-tertiary border rounded small font-monospace';
              card.innerHTML = `<div class="text-primary fw-semibold"><i class="bi bi-tools pe-3"></i> MCP Tool Invoked: <code>${tr.toolName}</code></div>
                                <div class="text-secondary small">${JSON.stringify(tr.args)}</div>`;
              bubble.appendChild(card);
            }
          });
        }
      }

      wrapper.appendChild(bubble);
      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      if (sendBtn) sendBtn.disabled = true;

      // Loading Indicator
      const loadingWrapper = document.createElement('div');
      loadingWrapper.className = 'd-flex justify-content-start mb-3';
      loadingWrapper.id = 'loading-msg';
      loadingWrapper.innerHTML = `
        <div class="chat-bubble-assistant p-3 small text-secondary d-flex align-items-center gap-2">
          <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          <span>Thinking...</span>
        </div>`;
      messagesContainer.appendChild(loadingWrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history })
        });
        
        const data = await res.json();
        document.getElementById('loading-msg')?.remove();

        if (res.ok) {
          appendMessage('assistant', data.reply, data.toolResults);
          history.push({ role: 'user', content: text });
          history.push({ role: 'assistant', content: data.reply });
        } else {
          appendMessage('assistant', `⚠️ **API Error:** ${data.error || 'Failed to get response'}`);
        }
      } catch (err) {
        document.getElementById('loading-msg')?.remove();
        appendMessage('assistant', `⚠️ **Network Error:** Could not connect to chatbot backend.`);
      } finally {
        if (sendBtn) sendBtn.disabled = false;
      }
    }

    async function loadNavLinks() {
      try {
        const res = await fetch('/nav-links.html');
        if (res.ok) {
          const html = await res.text();
          if (html.trim()) {
            const container = document.getElementById('nav-links-container');
            if (container) container.innerHTML = html;
          }
        }
      } catch (err) {
        console.debug('No custom nav-links.html found');
      }
    }
    loadNavLinks();
  </script>
</body>
</html>
