<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DITA Docs AI Assistant</title>
  <!-- Bootstrap 5 & Icons matching DITA-Bootstrap Docs Portal -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
  <style>
    body {
      background-color: var(--bs-tertiary-bg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .chat-bubble-user {
      background-color: var(--bs-primary);
      color: white;
      border-radius: 1rem 1rem 0.2rem 1rem;
      max-width: 80%;
    }
    .chat-bubble-assistant {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border: 1px solid var(--bs-border-color);
      border-radius: 1rem 1rem 1rem 0.2rem;
      width: 100%;
    }
    .chat-bubble-assistant.has-interactive {
      width: 100% !important;
      max-width: 100% !important;
    }
    .prose p { margin-bottom: 0.5rem; }
    .prose p:last-child { margin-bottom: 0; }

    /* Inline code vs Code blocks */
    .prose :not(pre) > code {
      background: var(--bs-tertiary-bg);
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      border: 1px solid var(--bs-border-color);
      color: var(--bs-body-color);
    }
    .prose pre,
    .prose pre.alert,
    .prose pre.alert-secondary,
    .prose pre.bg-light,
    .prose pre[class*="language-"] {
      background-color: #1e1e2e !important;
      color: #cdd6f4 !important;
      padding: 1rem !important;
      border-radius: 0.5rem !important;
      border: 1px solid #313244 !important;
      font-size: 0.875rem !important;
      line-height: 1.5 !important;
      overflow-x: auto !important;
      margin: 0.75rem 0 !important;
    }
    .prose pre code,
    .prose pre.alert code,
    .prose pre.alert-secondary code,
    .prose pre.bg-light code {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      font-size: inherit !important;
      color: inherit !important;
      white-space: pre !important;
    }

    /* Prism Syntax Highlighting Tokens */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #6c7086; font-style: italic; }
    .token.punctuation { color: #9399b2; }
    .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol, .token.deleted { color: #f38ba8; }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: #a6e3a1; }
    .token.operator, .token.entity, .token.url, .language-css .token.string { color: #89dceb; }
    .token.atrule, .token.attr-value, .token.keyword { color: #cba6f7; font-weight: 600; }
    .token.function, .token.class-name { color: #89b4fa; }
    .token.regex, .token.important, .token.variable { color: #fab387; }

    .iframe-container {
      width: 100%;
      border: 1px solid var(--bs-border-color);
      border-radius: 0.5rem;
      overflow: hidden;
      background: var(--bs-body-bg);
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Navbar matching frontend/ DITA Docs Portal -->
  <nav class="navbar navbar-expand bg-dark navbar-dark border-bottom shadow-sm py-2 shrink-0" data-bs-theme="dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-white" href="#">
        <i class="bi bi-robot fs-4 text-white"></i>
        <span>DITA Docs AI Assistant</span>
      </a>

      <div class="d-flex align-items-center gap-3">
        <button onclick="clearChat()" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1.5" title="Clear conversation to reset context & save tokens">
          <i class="bi bi-trash3"></i>
          <span>Clear Chat</span>
        </button>
        <div class="d-none align-items-center gap-3" id="debug-badges">
          <span class="badge text-bg-light border font-monospace" id="provider-badge">
            Provider: Checking...
          </span>
          <span class="badge text-bg-success border" id="mcp-status-badge">
            <i class="bi bi-circle-fill me-1 fs-6"></i> MCP Connected
          </span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Chat Container -->
  <main class="flex-grow-1 container-fluid max-w-6xl py-4 d-flex flex-column overflow-hidden" style="max-width: 1140px;">
    <!-- Messages Scroll Region -->
    <div id="messages-container" class="flex-grow-1 overflow-auto pe-2 mb-3 space-y-3">
      <!-- Welcome Card -->
      <div class="card shadow-sm mb-3" id="welcome-card">
        <div class="card-body">
          <h5 class="card-title text-primary d-flex align-items-center gap-2" id="welcome-title">
            <i class="bi bi-stars"></i> Welcome to Documentation AI Assistant
          </h5>
          <p class="card-text text-secondary small" id="welcome-desc">
            Ask technical questions or request interactive previews for loaded documentation sets.
          </p>
          <div class="d-flex flex-wrap gap-2 pt-1" id="quick-prompts-container">
            <button onclick="sendQuickPrompt('What documentation sets are available?')" class="btn btn-outline-secondary btn-sm">
              📚 List Doc Sets
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Box -->
    <div class="card shadow-sm shrink-0">
      <div class="card-body p-2">
        <form id="chat-form" onsubmit="handleFormSubmit(event)" class="d-flex gap-2">
          <input 
            type="text" 
            id="user-input" 
            placeholder="Ask a question or request a component preview..." 
            class="form-control border-0 shadow-none" 
            autocomplete="off"
          />
          <button 
            type="submit" 
            id="send-btn"
            class="btn btn-primary d-flex align-items-center gap-1.5 shrink-0 px-4"
          >
            <span>Send</span>
            <i class="bi bi-send-fill"></i>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const history = [];
    const messagesContainer = document.getElementById('messages-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    let showToolInvocations = false;

    // Configure marked with Prism syntax highlighting
    if (window.marked && typeof marked.Renderer === 'function') {
      const renderer = new marked.Renderer();
      renderer.code = function(codeOrObj, infostring) {
        let text = "";
        let lang = "";

        if (typeof codeOrObj === "object" && codeOrObj !== null) {
          text = codeOrObj.text || "";
          lang = codeOrObj.lang || "";
        } else {
          text = String(codeOrObj || "");
          lang = String(infostring || "");
        }

        const language = (lang && window.Prism && Prism.languages[lang]) ? lang : "bash";
        const grammar = window.Prism ? (Prism.languages[language] || Prism.languages.bash || Prism.languages.markup) : null;
        let highlighted = text;
        try {
          if (grammar) {
            highlighted = Prism.highlight(text, grammar, language);
          }
        } catch (e) {
          highlighted = text;
        }

        return `<pre class="language-${language}"><code class="language-${language}">${highlighted}</code></pre>`;
      };
      marked.use({ renderer });
    }

    // Fetch Health on Load
    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (data.showToolInvocations) {
          showToolInvocations = true;
          const debugBadges = document.getElementById('debug-badges');
          if (debugBadges) {
            debugBadges.classList.remove('d-none');
            debugBadges.classList.add('d-flex');
          }
        }
        document.getElementById('provider-badge').textContent = `${data.provider} (${data.model})`;
        const badge = document.getElementById('mcp-status-badge');
        
        if (data.mcpConnected) {
          badge.className = "badge text-bg-success border";
          badge.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> MCP Connected (${data.toolsCount} tools)`;
        } else {
          badge.className = "badge text-bg-danger border";
          badge.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i> MCP Offline`;
        }

        // Dynamically update Welcome Card text & quick prompts
        if (Array.isArray(data.docSets) && data.docSets.length > 0) {
          const titles = data.docSets.map(ds => ds.title || ds.id).join(', ');
          const descEl = document.getElementById('welcome-desc');
          if (descEl) {
            descEl.textContent = `Ask technical questions or request interactive previews across loaded documentation sets: ${titles}.`;
          }

          const promptsContainer = document.getElementById('quick-prompts-container');
          if (promptsContainer) {
            promptsContainer.innerHTML = `
              <button onclick="sendQuickPrompt('What documentation sets are available?')" class="btn btn-outline-secondary btn-sm">
                📚 List Doc Sets
              </button>
            `;
            data.docSets.forEach(ds => {
              const btn = document.createElement('button');
              btn.className = 'btn btn-outline-primary btn-sm';
              btn.onclick = () => sendQuickPrompt(`Show me overview for ${ds.title || ds.id}`);
              btn.textContent = `📖 ${ds.title || ds.id}`;
              promptsContainer.appendChild(btn);
            });
          }
        }
      } catch (e) {
        document.getElementById('provider-badge').textContent = 'Error';
      }
    }
    checkHealth();

    function sendQuickPrompt(text) {
      userInput.value = text;
      handleFormSubmit(new Event('submit'));
    }

    function clearChat() {
      history.length = 0;
      const welcomeCard = document.getElementById('welcome-card');
      messagesContainer.innerHTML = '';
      if (welcomeCard) {
        messagesContainer.appendChild(welcomeCard);
      }
    }

    function appendMessage(role, text, toolResults = []) {
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'd-flex justify-content-end mb-3' : 'd-flex justify-content-start mb-3 w-100';

      const bubble = document.createElement('div');
      const hasInteractive = toolResults && toolResults.some(tr => tr.toolName === 'render_topic_ui');
      
      bubble.className = role === 'user' 
        ? 'chat-bubble-user p-3 shadow-sm' 
        : `chat-bubble-assistant p-3 shadow-sm ${hasInteractive ? 'has-interactive w-100' : ''}`;

      if (role === 'user') {
        bubble.textContent = text;
      } else {
        const prose = document.createElement('div');
        prose.className = 'prose';
        try {
          if (window.marked && typeof marked.parse === 'function') {
            prose.innerHTML = marked.parse(text || "");
          } else {
            prose.textContent = text || "";
          }
        } catch(err) {
          console.error("Markdown parse error:", err);
          prose.textContent = text || "";
        }
        bubble.appendChild(prose);

        // If render_topic_ui tool call was made, render FULL WIDTH Bootstrap iframe card
        if (toolResults && toolResults.length > 0) {
          toolResults.forEach(tr => {
            if (tr.toolName === 'render_topic_ui') {
              const card = document.createElement('div');
              card.className = 'iframe-container mt-3 shadow-sm w-100';
              
              let payload = null;
              try {
                const text = tr.result?.content?.[0]?.text;
                if (text) payload = JSON.parse(text);
              } catch(e){}

              const viewerUrl = `${window.location.protocol}//${window.location.hostname}:4001/viewer`;

              const header = document.createElement('div');
              header.className = 'bg-light border-bottom px-3 py-2 text-secondary small d-flex justify-content-between align-items-center font-monospace';
              
              const docTitle = payload?.toc?.title || payload?.docId;
              const pageTitle = payload?.doc?.meta?.title || tr.args?.topicPath || 'Topic Viewer';
              const titleText = docTitle && docTitle !== pageTitle ? `${docTitle} | ${pageTitle}` : pageTitle;

              header.innerHTML = `<span class="fw-semibold text-primary"><i class="bi bi-box-fill me-2"></i>${titleText}</span>`;
              card.appendChild(header);

              const iframe = document.createElement('iframe');
              iframe.className = 'w-100 border-0';
              iframe.style.height = '480px';
              iframe.src = viewerUrl;
              
              iframe.onload = () => {
                if (payload) {
                  const sendPayload = () => iframe.contentWindow?.postMessage({ type: 'SET_PAYLOAD', payload: payload }, '*');
                  sendPayload();
                  setTimeout(sendPayload, 100);
                  setTimeout(sendPayload, 300);
                  setTimeout(sendPayload, 800);
                }
              };

              card.appendChild(iframe);
              bubble.appendChild(card);
            } else if (showToolInvocations) {
              const card = document.createElement('div');
              card.className = 'mt-2 p-2 bg-light border rounded small font-monospace';
              card.innerHTML = `<div class="text-primary fw-semibold"><i class="bi bi-tools me-1"></i> MCP Tool Invoked: <code>${tr.toolName}</code></div>
                                <div class="text-secondary small">${JSON.stringify(tr.args)}</div>`;
              bubble.appendChild(card);
            }
          });
        }
      }

      wrapper.appendChild(bubble);
      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      if (sendBtn) sendBtn.disabled = true;

      // Loading Indicator
      const loadingWrapper = document.createElement('div');
      loadingWrapper.className = 'd-flex justify-content-start mb-3';
      loadingWrapper.id = 'loading-msg';
      loadingWrapper.innerHTML = `
        <div class="chat-bubble-assistant p-3 small text-secondary d-flex align-items-center gap-2">
          <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          <span>LLM reasoning & querying MCP tools...</span>
        </div>`;
      messagesContainer.appendChild(loadingWrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history })
        });
        
        const data = await res.json();
        document.getElementById('loading-msg')?.remove();

        if (res.ok) {
          appendMessage('assistant', data.reply, data.toolResults);
          history.push({ role: 'user', content: text });
          history.push({ role: 'assistant', content: data.reply });
        } else {
          appendMessage('assistant', `⚠️ **API Error:** ${data.error || 'Failed to get response'}`);
        }
      } catch (err) {
        document.getElementById('loading-msg')?.remove();
        appendMessage('assistant', `⚠️ **Network Error:** Could not connect to chatbot backend.`);
      } finally {
        if (sendBtn) sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
