# Adds the RAG vector search service for large document sets:
#   docker compose -f docker-compose.yml -f docker-compose.rag.yml up -d
services:
  data-store:
    environment:
      # reindex rag-service after doc set uploads and deletes
      - RAG_SERVICE_URL=http://rag-service:4002

  mcp-server:
    environment:
      - RAG_SERVICE_URL=http://rag-service:4002

  rag-service:
    image: ghcr.io/jason-fox/ast-rag-service:${TAG:-latest}
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - '4002:4002'
    environment:
      - PORT=4002
      - DATA_DIR=/app/data
    volumes:
      - ./data-store/data:/app/data
    restart: unless-stopped
