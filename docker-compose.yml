version: "3.8"

services:
  # 1. Express Backend Data API
  data-store:
    image: ghcr.io/jason-fox/ast-data-store:${TAG:-latest}
    build:
      context: ./data-store
      dockerfile: Dockerfile
    container_name: data-store
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATA_DIR=/app/data
      # optional bearer token guarding POST/PUT/DELETE /api/docs/<id>; unset = auth disabled
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    volumes:
      - ./data-store/data:/app/data
    restart: unless-stopped

  # 2. DITA MCP Server (HTTP Streamable Transport)
  mcp-server:
    image: ghcr.io/jason-fox/ast-mcp-server:${TAG:-latest}
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATA_DIR=/app/data
      - RAG_SERVICE_URL=http://rag-service:4002
      - BOOTSTRAP_THEME=default
      - NAVBAR_THEME=dark
      - NAVBAR_TEXT=dark
    volumes:
      - ./data-store/data:/app/data
    restart: unless-stopped

  # 3. Optional Standalone RAG Service (Semantic Vector Search)
  rag-service:
    image: ghcr.io/jason-fox/ast-rag-service:${TAG:-latest}
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - DATA_DIR=/app/data
    volumes:
      - ./data-store/data:/app/data
    restart: unless-stopped

  # 4. Next.js Documentation Renderer & AI Assistant Portal
  renderer:
    image: ghcr.io/jason-fox/ast-renderer:${TAG:-latest}
    build:
      context: ./renderer
      dockerfile: Dockerfile
    container_name: renderer
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - INTERNAL_DATA_URL=http://data-store:4000/data
      - INTERNAL_API_URL=http://data-store:4000/api
      - NEXT_PUBLIC_DATA_URL=http://localhost:4000/data
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - MCP_SERVER_URL=http://mcp-server:4001/mcp
      - BOOTSTRAP_THEME=default
      - NAVBAR_THEME=dark
      - NAVBAR_TEXT=dark
      - OPEN_GRAPH_URL=http://localhost:3000
    depends_on:
      - data-store
      - mcp-server
    restart: unless-stopped

