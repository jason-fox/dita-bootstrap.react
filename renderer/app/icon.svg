<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    .shelf-bg { fill: #f8f9fa; }
    .shelf-border { fill: none; stroke: #6f42c1; stroke-width: 2; }
    .shelf-line { stroke: #6f42c1; stroke-width: 2; stroke-linecap: round; }
    .book-1 { fill: #6f42c1; } /* Purple */
    .book-2 { fill: #0d6efd; } /* Blue */
    .book-3 { fill: #0dcaf0; } /* Cyan */
    .book-spine-detail { fill: rgba(255,255,255,0.3); }

    @media (prefers-color-scheme: dark) {
      .shelf-bg { fill: #2a1b4e; /* Rich dark purple background */ }
      .shelf-border { stroke: #b794f4; /* Lighter purple border */ }
      .shelf-line { stroke: #b794f4; /* Lighter purple shelf line */ }
      .book-3 { fill: #31d2f2; /* Brighter cyan for dark mode contrast */ }
    }
  </style>

  <!-- Background / Frame Base -->
  <rect class="shelf-bg" x="1" y="1" width="30" height="30" rx="7"/>
  <rect class="shelf-border" x="1" y="1" width="30" height="30" rx="7"/>

  <!-- Books Group (Positioned on the shelf) -->
  <g transform="translate(6, 6)">
    <!-- Book 1 (Purple) -->
    <rect class="book-1" x="1" y="3" width="5" height="15" rx="1"/>
    <rect class="book-spine-detail" x="2" y="5" width="3" height="2"/>

    <!-- Book 2 (Blue) -->
    <rect class="book-2" x="7" y="1" width="6" height="17" rx="1"/>
    <rect class="book-spine-detail" x="8" y="4" width="4" height="2"/>
    <rect class="book-spine-detail" x="8" y="8" width="4" height="1"/>

    <!-- Book 3 (Cyan) -->
    <rect class="book-3" x="14" y="4" width="5" height="14" rx="1"/>
    <rect class="book-spine-detail" x="15" y="6" width="3" height="2"/>
  </g>

  <!-- The Shelf Line -->
  <line class="shelf-line" x1="4" y1="26" x2="28" y2="26"/>
</svg>
